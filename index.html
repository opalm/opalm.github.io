<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome | GitHub Pages</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #656d76;
      --border: #d0d7de;
      --accent: #0969da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #848d97;
        --border: #30363d;
        --accent: #58a6ff;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--fg);
      line-height: 1.6;
      display: flex;
      justify-content: center;
      padding: 4rem 1.5rem;
    }
    main {
      max-width: 680px;
      width: 100%;
    }
    h1 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }
    p {
      color: var(--muted);
      margin-bottom: 1.5rem;
    }
    .links {
      display: flex;
      gap: 1.25rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
    }
    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello, World.</h1>
    <p>Site initialized on GitHub Pages.</p>
    <nav class="links">
      <a href="https://github.com" target="_blank" rel="noopener noreferrer">GitHub</a>
    </nav>
  </main>
</body>
</html>
